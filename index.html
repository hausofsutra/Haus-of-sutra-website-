<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Feed - Carousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="carousel-container">
        <div class="carousel-wheel" id="carousel">
            <!-- Items will be dynamically loaded from Behold API -->
            <div class="loading">Loading...</div>
        </div>
    </div>

    <div class="controls">
        <div class="instructions">
            <svg class="arrow" width="80" height="30" viewBox="0 0 80 30" fill="none"
                xmlns="http://www.w3.org/2000/svg">
                <!-- Left arrowhead -->
                <path d="M8 15 L15 8 M8 15 L15 22" stroke="white" stroke-width="2" stroke-linecap="round" />
                <!-- Curved arc -->
                <path d="M12 15 Q40 0 68 15" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" />
                <!-- Right arrowhead -->
                <path d="M72 15 L65 8 M72 15 L65 22" stroke="white" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>
        <button class="description-toggle" id="descToggle">Description</button>
    </div>

    <div class="post-description-panel" id="postDescription">
        <div class="description-content" id="descriptionContent">
            Select a post to see its caption
        </div>
    </div>

    <div class="profile-card" id="profileCard">
        <img class="profile-avatar" id="profileAvatar" src="" alt="Profile" style="display: none;">
        <div class="profile-info">
            <div class="profile-username" id="username"></div>
            <div class="profile-name" id="profileName"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
