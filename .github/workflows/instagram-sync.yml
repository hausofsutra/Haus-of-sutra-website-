name: Sync Instagram Feed

on:
  schedule:
    # Run at noon and midnight Pacific Time
    # Pacific is UTC-8 (or UTC-7 during DST)
    # Noon Pacific = 20:00 UTC (8pm UTC)
    # Midnight Pacific = 08:00 UTC
    - cron: '0 8,20 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install instaloader

      - name: Run Instagram sync script
        run: python instagram/grab_posts.py

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: sync Instagram feed [skip ci]"
          git push
